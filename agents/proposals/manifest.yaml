run_as: app

# Deliberately empty of authority beyond the app's own storage.
#
# This app reads what the agent wrote and saves edits back — nothing else. It
# does not invoke the agent (the cron schedule is the only trigger, so there is
# no `agents:` grant) and it does not call Granola itself (the agent owns that,
# so there is no `personal_connectors:` grant). Every meeting the app displays
# reached it as a field on a proposal record.
