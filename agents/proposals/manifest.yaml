# App authority, ratified at deploy against the deployer's own grants.
#
# `run_as: app` is mandatory on apps v2: the worker IS the principal.
run_as: app

# One authority, and only one: starting `proposal-writer` when someone presses
# Run now. The cron schedule is still the agent's normal trigger — this is the
# impatient path, not a replacement for it.
#
# THE SCHEDULE BELONGS TO THE AGENT, NOT TO THIS APP. An app cron could not do
# this job: a cron invocation has no caller, and a run is owned by (app, user),
# so `agents.start()` from cron is refused with a 409. That refusal is not a
# gap to work around — an unattended run of a PERSONAL agent has no owner whose
# Granola account it would read. Give the agent its own schedule instead.
#
# Everything else stays absent. The app does not call Granola (the agent owns
# that connector, so there is no `personal_connectors:` grant), so every meeting
# the app displays still reached it as a field on a proposal record.
#
# Under v2 `agents:` is a REFUSAL LIST: an agent not named here cannot be
# started from the worker, whatever grants the deployer holds. It also ratifies
# against the deploying user's own grants, and proposal-writer is a PERSONAL
# agent — invoking one is owner-only, with no admin override. So Run now is
# expected to work for the person who created the agent and to fail for everyone
# else. The app has no way to ask who that is, so it shows the button to
# everyone and explains the failure (see `agentCallError`) rather than hiding it
# behind a guess.
agents: [proposal-writer]
