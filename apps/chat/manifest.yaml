# App authority, ratified at deploy against the deployer's own grants.
#
# `run_as: app` is mandatory on apps v2, and here it is also the honest
# description: the chat needs authority its individual users may not hold — the
# LLM gateway, ad-hoc SQL, and the PostHog service connector. The worker holds
# all three; the browser holds none of them.
run_as: app

# The agent loop: llm.stream({ tools }) plans, calls tools, and writes the
# answer — all inside the worker, so the model's reach is exactly the set of
# `run` functions in server/tools.ts and nothing wider.
llm: true

# Direct SQL is deliberately scarce authority. It is declared here because this
# template's whole point is text-to-SQL — the model writes the query.
# Connections are read-only server-side, and server/sql.ts additionally rejects
# anything that isn't a single SELECT/WITH before it is ever sent.
adhoc_sql:
  - railcode-demo

# Only the endpoints the PostHog tools actually call. Anything not listed is a
# 403 at the proxy, so this doubles as the tool surface's allowlist.
connectors:
  posthog:
    - "POST /api/projects/@current/query/"
    - "GET /api/projects/@current/insights/"
    - "GET /api/projects/@current/feature_flags/"
    - "GET /api/projects/@current/events/"
    - "GET /api/projects/@current/persons/"
    - "GET /api/organizations/@current/"
